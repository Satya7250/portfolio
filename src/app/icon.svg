<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 100 100"
>
  <!-- White Background -->
  <rect
    width="100"
    height="100"
    rx="20"
    fill="#ffffff"
  />

  <!-- Outer Circle -->
  <circle
    cx="50"
    cy="50"
    r="44"
    fill="none"
    stroke="#000000"
    stroke-width="2.5"
  />

  <!-- Letter S -->
  <text
    x="50"
    y="50"
    dy="0.32em"
    text-anchor="middle"
    font-family="Inter, Poppins, sans-serif"
    font-size="58"
    font-weight="400"
    fill="none"
    stroke="#000000"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    S
  </text>
</svg>